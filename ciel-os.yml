name: Compiler CIEL OS

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Modèle de calculatrice"
        type: choice
        default: n0120
        options:
          - n0120
          - n0115
          - n0110

env:
  MAKEFLAGS: -j2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download toolchain
        uses: numworks/setup-arm-toolchain@latest

      - name: Checkout
        uses: actions/checkout@v6

      - name: Build container and define DOCKER_RUN
        uses: ./.github/actions/docker-builder
        with:
          platform: device

      - name: Build ${{ inputs.model }}
        run: $DOCKER_RUN "make PLATFORM=${{ inputs.model }} epsilon_userland.A.onboarding.allow3rdparty.dfu"

      - name: Rename to ciel-os-${{ inputs.model }}.dfu
        run: |
          mkdir -p dist
          cp epsilon/output/release/${{ inputs.model }}/epsilon*allow3rdparty.dfu dist/ciel-os-${{ inputs.model }}.dfu
          ls -l dist

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: ciel-os-${{ inputs.model }}
          path: dist/ciel-os-${{ inputs.model }}.dfu
          retention-days: 30
